<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Stack 3D</title>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #202025; /* Dark background */
            font-family: 'Montserrat', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Gradient background handled by CSS for better performance than Three.js background clear */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hud {
            position: absolute;
            top: 40px;
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        .score-big {
            font-size: 64px;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 0;
            line-height: 1;
        }

        .label {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 90%;
            transform: scale(1);
            transition: transform 0.2s;
        }

        .btn {
            background: #4361ee;
            border: none;
            padding: 15px 50px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.4);
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #3a56d4;
        }
        
        .btn:active {
            transform: translateY(1px);
        }

        h1 {
            color: #2b2b2b;
            margin: 0 0 10px 0;
            font-size: 36px;
            font-weight: 900;
        }

        p { color: #666; margin-bottom: 10px; font-weight: 500;}

        .hidden { display: none !important; opacity: 0; }

    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="uiLayer">
        
        <div class="hud" id="hud">
            <div class="score-big" id="scoreEl">0</div>
            <div class="label">Height</div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="panel">
            <h1>SKY STACK</h1>
            <p>Tap to place the block.</p>
            <p>Don't miss.</p>
            <button class="btn" id="startBtn">PLAY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="panel hidden">
            <h1>TOPPLED</h1>
            <p>Final Height</p>
            <div class="score-big" id="finalScore" style="color:#4361ee; font-size: 48px;">0</div>
            <button class="btn" id="restartBtn">TRY AGAIN</button>
        </div>
    </div>

    <!-- Canvas Container -->
    <div id="gameCanvas"></div>

    <script>
        // --- Configuration ---
        const BOX_HEIGHT = 1;
        const ORIGINAL_BOX_SIZE = 3;
        const SPEED_BASE = 0.15;
        
        // --- State ---
        let scene, camera, renderer;
        let stack = []; 
        let debris = [];
        let gameRunning = false;
        let score = 0;
        let cameraY = 4;
        
        // Block Logic
        let currentBlock = null;
        let previousBlock = null;
        let isMovingX = true; // Alternates X and Z
        let speed = SPEED_BASE;
        let direction = 1; // 1 or -1
        
        // HTML Elements
        const scoreEl = document.getElementById('scoreEl');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');

        // --- Initialization ---

        function init() {
            // Scene
            scene = new THREE.Scene();
            
            // Isometric Camera setup
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            
            camera.position.set(10, 10, 10); // Isometric angle
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('gameCanvas').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 0);
            scene.add(dirLight);
            
            // Soft shadow light
            const light2 = new THREE.DirectionalLight(0xffffff, 0.3);
            light2.position.set(-10, 20, 10);
            scene.add(light2);

            // Listeners
            window.addEventListener('resize', onWindowResize, false);
            // Click/Touch anywhere to play
            window.addEventListener('pointerdown', handleInput);

            animate();
        }

        function resetGame() {
            // Clear existing blocks
            stack.forEach(mesh => scene.remove(mesh));
            debris.forEach(mesh => scene.remove(mesh));
            stack = [];
            debris = [];
            
            if (currentBlock) scene.remove(currentBlock);
            
            score = 0;
            scoreEl.innerText = score;
            speed = SPEED_BASE;
            cameraY = 4;
            camera.position.y = cameraY + 6; // Reset camera
            camera.lookAt(0, cameraY - 4, 0);

            // Create Base Block
            addLayer(0, 0, ORIGINAL_BOX_SIZE, ORIGINAL_BOX_SIZE); // Base
            spawnNextLayer();

            gameRunning = true;
        }

        // --- Core Logic ---

        function addLayer(x, z, width, depth) {
            const y = stack.length * BOX_HEIGHT; // Stack upwards
            
            const geometry = new THREE.BoxGeometry(width, BOX_HEIGHT, depth);
            
            // Dynamic Color Generation
            const hue = 200 + (stack.length * 5); // Shift blue -> purple -> pink
            const color = new THREE.Color(`hsl(${hue % 360}, 70%, 50%)`);
            
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.set(x, y, z);
            
            scene.add(mesh);
            stack.push(mesh);
            
            return mesh;
        }

        function spawnNextLayer() {
            previousBlock = stack[stack.length - 1];
            
            // determine size based on previous block geometry parameters
            const prevGeo = previousBlock.geometry.parameters;
            
            const geometry = new THREE.BoxGeometry(prevGeo.width, BOX_HEIGHT, prevGeo.depth);
            const material = new THREE.MeshLambertMaterial({ 
                color: new THREE.Color(`hsl(${(200 + (stack.length * 5)) % 360}, 70%, 60%)`) // Slightly lighter for active block
            });
            
            currentBlock = new THREE.Mesh(geometry, material);
            
            // Alternate Axis
            isMovingX = !isMovingX;
            
            // Position it "off screen" (relative to stack)
            const spawnDist = 6;
            if (isMovingX) {
                currentBlock.position.set(-spawnDist, (stack.length) * BOX_HEIGHT, previousBlock.position.z);
            } else {
                currentBlock.position.set(previousBlock.position.x, (stack.length) * BOX_HEIGHT, -spawnDist);
            }
            
            scene.add(currentBlock);
        }

        function handleInput(e) {
            // Prevent interaction if clicking buttons
            if (e.target.tagName === 'BUTTON') return;
            if (!gameRunning) return;

            placeBlock();
        }

        function placeBlock() {
            if (!currentBlock || !previousBlock) return;

            const prevPos = previousBlock.position;
            const currPos = currentBlock.position;
            
            // Current Dimensions
            const width = currentBlock.geometry.parameters.width;
            const depth = currentBlock.geometry.parameters.depth;

            let delta, overlap, newWidth, newDepth;

            // --- Logic for X Axis Movement ---
            if (isMovingX) {
                delta = currPos.x - prevPos.x;
                overlap = width - Math.abs(delta);

                if (overlap > 0) {
                    // Success: Cut
                    newWidth = overlap;
                    newDepth = depth;
                    
                    // Determine new position (center of the overlap)
                    const newX = prevPos.x + (delta / 2);

                    // Debris
                    const debrisWidth = width - newWidth;
                    const debrisX = currPos.x + (width / 2 * (delta > 0 ? 1 : -1)) - (debrisWidth / 2 * (delta > 0 ? 1 : -1)); // Wait, simplification:
                    // Debris is the part that was cut off.
                    // If moving right (delta > 0), cut is on the right.
                    const cutPos = delta > 0 ? (currPos.x + (width/2) + (delta/2)) : (currPos.x - (width/2) + (delta/2)); 
                    // Actually simpler math:
                    // Debris pos = Edge of previous block + half debris width
                    const edgeX = prevPos.x + (width / 2 * (delta > 0 ? 1 : -1));
                    const debrisPosX = edgeX + (debrisWidth / 2 * (delta > 0 ? 1 : -1));

                    spawnDebris(debrisPosX, currPos.y, currPos.z, debrisWidth, depth);
                    
                    // Replace Current Block with permanent stack block
                    scene.remove(currentBlock);
                    addLayer(newX, currPos.z, newWidth, newDepth);
                    
                    // Difficulty increase
                    score++;
                    scoreEl.innerText = score;
                    
                    // Next
                    spawnNextLayer();
                    
                } else {
                    // Fail
                    gameOver();
                }
            } 
            
            // --- Logic for Z Axis Movement ---
            else {
                delta = currPos.z - prevPos.z;
                overlap = depth - Math.abs(delta);

                if (overlap > 0) {
                    newWidth = width;
                    newDepth = overlap;
                    
                    const newZ = prevPos.z + (delta / 2);
                    
                    const debrisDepth = depth - newDepth;
                    const edgeZ = prevPos.z + (depth / 2 * (delta > 0 ? 1 : -1));
                    const debrisPosZ = edgeZ + (debrisDepth / 2 * (delta > 0 ? 1 : -1));
                    
                    spawnDebris(currPos.x, currPos.y, debrisPosZ, width, debrisDepth);

                    scene.remove(currentBlock);
                    addLayer(currPos.x, newZ, newWidth, newDepth);
                    
                    score++;
                    scoreEl.innerText = score;
                    spawnNextLayer();

                } else {
                    gameOver();
                }
            }
        }

        function spawnDebris(x, y, z, w, d) {
            const geometry = new THREE.BoxGeometry(w, BOX_HEIGHT, d);
            const material = new THREE.MeshLambertMaterial({ color: 0xff5555 }); // Reddish for fail pieces
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            debris.push({
                mesh: mesh,
                velocity: { y: 0, x: (Math.random()-0.5)*0.1, z: (Math.random()-0.5)*0.1 }
            });
        }

        function gameOver() {
            gameRunning = false;
            // Make the current block fall as one big debris
            if (currentBlock) {
                 spawnDebris(currentBlock.position.x, currentBlock.position.y, currentBlock.position.z, 
                            currentBlock.geometry.parameters.width, currentBlock.geometry.parameters.depth);
                 scene.remove(currentBlock);
                 currentBlock = null;
            }

            finalScoreEl.innerText = score;
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
        }

        function animate() {
            requestAnimationFrame(animate);

            // --- Game Logic ---
            if (gameRunning && currentBlock) {
                // Move Block
                const limit = 7;
                const moveSpeed = SPEED_BASE + (score * 0.005); // Speed up slightly every block
                
                if (isMovingX) {
                    currentBlock.position.x += moveSpeed * direction;
                    if (Math.abs(currentBlock.position.x) > limit) direction *= -1;
                } else {
                    currentBlock.position.z += moveSpeed * direction;
                    if (Math.abs(currentBlock.position.z) > limit) direction *= -1;
                }

                // Move Camera Up smoothly
                const targetCamY = 10 + (stack.length * BOX_HEIGHT);
                camera.position.y += (targetCamY - camera.position.y) * 0.05;
                camera.lookAt(0, (stack.length * BOX_HEIGHT) - 4, 0); // Always look slightly below top
            }

            // --- Debris Physics ---
            for (let i = debris.length - 1; i >= 0; i--) {
                let d = debris[i];
                d.velocity.y -= 0.02; // Gravity
                d.mesh.position.y += d.velocity.y;
                d.mesh.position.x += d.velocity.x;
                d.mesh.position.z += d.velocity.z;
                d.mesh.rotation.x += 0.05;
                d.mesh.rotation.z += 0.05;
                
                // Remove if too low
                if (d.mesh.position.y < -10) {
                    scene.remove(d.mesh);
                    debris.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            const d = 10;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Buttons ---
        document.getElementById('startBtn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent block placement
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            if (!scene) init();
            else resetGame();
            if (!stack.length) resetGame();
        });

        document.getElementById('restartBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            resetGame();
        });
        
        // Start Loop immediately so we see the black screen/renderer ready
        if(!scene) init();

    </script>
</body>
</html>
